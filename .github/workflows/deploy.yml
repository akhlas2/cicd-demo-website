name: CI und CD - Demo Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI - Website pruefen
    runs-on: ubuntu-latest
    steps:
      - name: Code aus GitHub holen
        uses: actions/checkout@v4
      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-Syntax pruefen
        run: node --check app.js
      - name: Automatisierte Tests ausfuehren
        run: node --test tests.mjs

  deploy:
    name: CD - GitHub Pages veroeffentlichen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code aus GitHub holen
        uses: actions/checkout@v4
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website-Dateien vorbereiten
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Website veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
